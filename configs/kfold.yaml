# === Model Configuration === #
channel_s: 384
channel_z: 256
lm_dropout: 0.25

input_embedder:
  channel_s: 384
  channel_z: 256
  channel_atom: 128
  channel_atompair: 16
  atom_encoder_blocks: 3
  atom_encoder_heads: 4
  ckpt_atom_stack: false

apo_module:
  channel_apo: 64
  channel_z: 256
  num_blocks: 2
  num_tri_heads: 4
  dropout: 0.1
  num_distogram_bins: 39
  min_dist: 3.25
  max_dist: 50.75
  blocks_per_ckpt: null

protein_sequence_encoder:
  model_path: null
  cache_dir: null
  vocab_size: 64
  d_model: 2304
  n_heads: 36
  n_layers: 48

protein_structure_encoder:
  model_path: null
  cache_dir: null
  d_model: 2560
  n_heads: 40
  n_layers: 33

rna_sequence_encoder:
  model_path: null
  cache_dir: null
  vocab_size: 64
  d_model: 960
  n_heads: 15
  n_layers: 30
  use_moe: true

trunk:
  num_lm_blocks: 4
  num_main_blocks: 48
  num_refine_blocks: 2
  dropout: 0.25
  blocks_per_ckpt: null

parcae:
  state_init: trunc_normal
  decay_init: 0.4472135954999579

score_model:
  channel_a: 1024
  channel_s: 384
  channel_z: 256
  channel_atom: 128
  channel_atompair: 16
  channel_coords: 6
  separate_endpoint_atom_encoder: true
  atom_encoder_blocks: 3
  atom_encoder_heads: 4
  token_transformer_blocks: 16
  token_transformer_heads: 16
  atom_decoder_blocks: 3
  atom_decoder_heads: 4
  blocks_per_ckpt: null
  ckpt_atom_stack: false

diffusion_head:
  # ECSI preconditioning & coefficients
  sigma_0: 16.0
  sigma_T: 27.0
  cov_0T: 175.0
  time_min: 1e-8
  time_max: 0.9999
  gamma_max: 6.0

  # Inference time schedule
  time_schedule_boundary: 0.5
  sample_step_fraction: [0.4, 0.6]
  sample_time_power: [0.5, 2.0]

  # Inference updates
  sde_end_time: 0.1
  eta: 1.0
  step_scale: 1.0

  # Churn
  churn_end_time: 0.5
  churn_factor_range: [0.1, 0.4]

  # Training time schedule
  train_time_distribution: logistic
  train_time_distribution_params: [-2.15, 2.25]
  train_x_0_perturb_time_min: 0.7
  train_x_0_perturb_prob: 0.0
  train_x_0_perturb_translation_std: 4.0

distogram_head:
  channel_z: 256
  num_bins: 64
  min_dist: 2.0
  max_dist: 22.0

confidence_head:
  channel_s: 384
  channel_z: 256
  num_heads_attn: 16
  num_blocks: 4
  dropout: 0.25
  num_bins: 39
  min_dist: 3.25
  max_dist: 50.75
  min_pae_dist: 0.0
  max_pae_dist: 32.0
  num_pae_bins: 64
  min_pde_dist: 0.0
  max_pde_dist: 32.0
  num_pde_bins: 64
  num_plddt_bins: 50
  blocks_per_ckpt: null

patch_pair_geometry:
  enabled: true
  channel_z: 256
  num_bins: 64
  min_dist: 2.0
  max_dist: 22.0
  patch_size: 16
  max_patches_per_chain: 8
  max_patch_pairs: 256
  pool_max_tokens_per_patch: 16
  positive_cutoff: 12.0
  hard_negative_cutoff: 18.0

# Training preconditioning
diffusion_conditioning_drop_rate: 0.2
confidence_conditioning_drop_rate: 0.2
